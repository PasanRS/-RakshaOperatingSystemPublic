# Calamares Partition Module — Raksha OS
# /etc/calamares/modules/partition.conf

# Partition layout
efiSize: 512
swapSize: 4096
rootSize: 51200
homeSize: remaining

# Filesystem types
efiFilesystem: fat32
swapFilesystem: swap
rootFilesystem: ext4
homeFilesystem: ext4

# Mount points
efiMountPoint: /boot/efi
swapMountPoint: none
rootMountPoint: /
homeMountPoint: /home

# Bootloader
bootloader: grub
efiSystemPartition: /boot/efi
