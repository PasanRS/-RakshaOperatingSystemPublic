# Calamares Users Module — Raksha OS
# /etc/calamares/modules/users.conf

# Default user
userGroup: ravan
userName: ravan
displayName: Pasan (ravan)
userPassword: raksha
userPasswordReenter: raksha
setAutologin: false
autologinGroup: autologin

# System user
rootPassword: raksha
rootPasswordReenter: raksha
setRootPassword: true
setAutologinDefault: false

# Hostname
hostname: raksha
hostnameTemplate: raksha-XXXX
