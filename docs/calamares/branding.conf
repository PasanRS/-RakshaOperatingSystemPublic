# Calamares Branding — Raksha OS
# Place in /etc/calamares/branding/raksha-os/

[Branding]
componentName=raksha-os
welcomeStyleCalamares=false
welcomeExpandingLogo=true

[Images]
# These paths are relative to the branding directory
banner=top.png
icon=icon.png
productLogo=logo.png
productWelcome=banner.png

[Style]
backgroundColor=#0a1a0a
textColor=#d4f7d4
accentColor=#2dd36f
dangerColor=#ff4444
warningColor=#ffaa00

[SlideShow]
# PNG files shown during installation
@SLIDESHOW_IMAGES@
