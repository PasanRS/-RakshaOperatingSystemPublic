# Calamares Settings — Raksha OS
# /etc/calamares/settings.conf

# Module sequence
modules:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
  - finished

# Branding
branding: raksha-os

# Mode: install (normal) or oem
mode: install

# Root mount point
rootMountPoint: /

# Skip machine-id (we generate our own)
skipMachineId: false

# Skip bootloader (we handle it)
# skipBootloader: false

# Disable root account by default
disableRootAccount: false

# Set hostname
hostname: raksha
setHostname: false

# Set hostname to user input
setHostnameUseHostname: false
setHostnameUseCustom: true
